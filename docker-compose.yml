# Local PostgreSQL for development: `docker compose up -d`
# Matches the defaults in backend/.env.example (set DB_PASSWORD there to the same value).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: uniproject
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uniproject"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
